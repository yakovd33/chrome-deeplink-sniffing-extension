<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Protocol Sniffer</title>
  <style>
    :root { --bg: #1e1e24; --text: #e0e0e0; --accent: #00ffaa; --card: #2b2b36; --danger: #ff3c50; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; width: 350px; padding: 16px; margin: 0; background: var(--bg); color: var(--text); }
    h2 { margin-top: 0; font-size: 18px; color: var(--accent); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #444; padding-bottom: 12px; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    
    .switch-container { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #aaa; }
    .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(14px); }

    .log-item { background: var(--card); border-left: 4px solid var(--accent); padding: 12px; margin-bottom: 10px; border-radius: 6px; word-break: break-all; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .header-row { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; }
    .time { font-size: 12px; color: #aaa; font-weight: 500; }
    .protocol-badge { background: rgba(0, 255, 170, 0.15); color: var(--accent); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
    .url { font-family: 'Fira Code', monospace; font-size: 12px; color: #fff; background: #1a1a20; padding: 8px; border-radius: 4px; border: 1px solid #333; }
    #clearBtn { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: opacity 0.2s; }
    #clearBtn:hover { opacity: 0.8; }
    #empty { text-align: center; color: #888; padding: 40px 10px; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <h2>
    <span>Protocol Sniffer 📡</span>
  </h2>
  
  <div class="controls">
    <div class="switch-container">
      <label class="switch">
        <input type="checkbox" id="autoOpenToggle">
        <span class="slider"></span>
      </label>
      Auto-open UI
    </div>
    <button id="clearBtn">Clear Logs</button>
  </div>

  <div id="logs"></div>
  <div id="empty">Listening in background...<br><br><small>All links are caught even when closed.</small></div>
  <script src="popup.js"></script>
</body>
</html>
